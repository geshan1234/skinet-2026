<header class="shadow-md p-3 w-full">
    <div class="flex flex-row align-middle justify-between items-center max-w-screen-2xl mx-auto">
        <img src="/images/logo.png" routerLink="/" alt="app logo" class="max-h-16">
        <nav class="flex gap-3 my-2 uppercase text-2xl">
            <a routerLink="/" 
                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
            <a routerLink="/shop" 
                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shop</a>
            <a routerLink="/contact" 
                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Contact</a>
        </nav>
        <div class="flex gap-3 align-middle">
            <a matBadge="5" matBadgeSize="large" class="custom-badge mt-2 mr-2">
                <mat-icon>shopping_cart</mat-icon>
            </a>
            <button mat-stroked-button>Login</button>
            <button mat-stroked-button>Sign in</button>
        </div>
    </div>
</header>
